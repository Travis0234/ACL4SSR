[custom]

; ============================================================
; 极简转换模板
; 只做中国直连，其余全部走 Proxies
; 港 / 台 / 新 / 日 / 美五个地区分开 url-test
; ============================================================
enable_rule_generator=true
overwrite_original_rules=true

; ============================================================
; 代理组
; ============================================================

; Proxies - 手动选择，包含五地区组和所有节点
custom_proxy_group=Proxies`select`[]HK`[]TW`[]SG`[]JP`[]US`.*

; 地区分组（url-test，tolerance：HK 10 / TW 10 / SG 15 / JP 15 / US 20）
custom_proxy_group=HK`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`600,,10
custom_proxy_group=TW`url-test`(台|新北|彰化|TW|tw|Taiwan|TaiWan)`http://www.gstatic.com/generate_204`600,,10
custom_proxy_group=SG`url-test`(狮城|坡|SG|Singapore|sg)`http://www.gstatic.com/generate_204`600,,15
custom_proxy_group=JP`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|jp)`http://www.gstatic.com/generate_204`600,,15
custom_proxy_group=US`url-test`(美|美国|美利坚|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates|USA|America)`http://www.gstatic.com/generate_204`600,,20

; ============================================================
; 规则 - 只有中国直连
; ============================================================

; 局域网直连
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/LocalAreaNetwork.list

; 中国域名直连
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国 IP 直连
ruleset=DIRECT,[]GEOIP,CN

; 内网 IP 直连
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10
ruleset=DIRECT,[]IP-CIDR6,::1/128
ruleset=DIRECT,[]IP-CIDR6,fc00::/7
ruleset=DIRECT,[]IP-CIDR6,fe80::/10
ruleset=DIRECT,[]IP-CIDR6,fd00::/8

; 兜底：其余全部走 Proxies
ruleset=Proxies,[]MATCH
