[custom]
; WestData/FlowerCloud 等机场同款远程配置
; 更强悍的分流，但同时也会占用更多内存
; ============================================================
; 全局设置
; ============================================================
enable_rule_generator=true
overwrite_original_rules=true

; ============================================================
; 代理组 | Proxy Groups
; ============================================================

; Proxies - 手动选择，包含所有节点及地区组
custom_proxy_group=Proxies`select`[]HK`[]JP`[]SG`[]TW`[]US`.*

; 流媒体分组
custom_proxy_group=YouTube`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Disney`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Hbomax`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Netflix`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Bahamut`select`[]Proxies`[]HK`[]TW
custom_proxy_group=Bilibili`select`[]DIRECT`[]HK`[]TW
custom_proxy_group=Spotify`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US

; 应用分组
custom_proxy_group=Steam`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Telegram`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Google`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Microsoft`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=OpenAI`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=PayPal`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Apple`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US

; 兜底
custom_proxy_group=Final`select`[]Proxies`[]DIRECT

; 地区分组（手动选择）
custom_proxy_group=HK`select`(🇭🇰|Hong Kong|hongkong|香港)
custom_proxy_group=JP`select`(🇯🇵|Japan|japan|日本)
custom_proxy_group=SG`select`(🇸🇬|Singapore|狮城|新加坡|singapore)
custom_proxy_group=TW`select`(🇨🇳 Taiwan|Taiwan|台湾)
custom_proxy_group=US`select`(🇺🇸|United States|美国|america|unitedstates)

; ============================================================
; Ruleset
; ============================================================

; ==本地地址直连==
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Lan/Lan.list

; ==广告追踪阻断==
ruleset=REJECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/AdvertisingLite/AdvertisingLite.list
;ruleset=REJECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Advertising/Advertising.list

; ==特殊网站直连==
; NTP 时间同步
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/NTPService/NTPService.list
; STUN
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/STUN/STUN.list
; PT下载
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PrivateTracker/PrivateTracker.list
; 下载器
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Download/Download.list

; ==YouTube==
ruleset=YouTube,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list

; ==Disney+==
ruleset=Disney,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Disney/Disney.list

; ==HBO Max==
ruleset=Hbomax,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/HBO/HBO.list

; ==Netflix==
ruleset=Netflix,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Netflix/Netflix.list
ruleset=Netflix,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Netflix/Netflix_IP.yaml

