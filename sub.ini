[custom]

; ============================================================
; 全局设置
; ============================================================
enable_rule_generator=true
overwrite_original_rules=true

; ============================================================
; 代理组
; ============================================================

; Proxies - 手动选择，包含所有节点及地区组
custom_proxy_group=Proxies`select`[]HK`[]JP`[]SG`[]TW`[]US`.*

; 流媒体分组
custom_proxy_group=YouTube`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Disney`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Hbomax`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Netflix`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Bahamut`select`[]Proxies`[]HK`[]TW
custom_proxy_group=Bilibili`select`[]DIRECT`[]HK`[]TW
custom_proxy_group=Spotify`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US

; 应用分组
custom_proxy_group=Steam`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Telegram`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Google`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Microsoft`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=OpenAI`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=PayPal`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US
custom_proxy_group=Apple`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US

; 兜底
custom_proxy_group=Final`select`[]Proxies`[]DIRECT

; 地区分组（手动选择）
custom_proxy_group=HK`select`(🇭🇰|Hong Kong|hongkong|香港)
custom_proxy_group=JP`select`(🇯🇵|Japan|japan|日本)
custom_proxy_group=SG`select`(🇸🇬|Singapore|狮城|新加坡|singapore)
custom_proxy_group=TW`select`(🇨🇳 Taiwan|Taiwan|台湾)
custom_proxy_group=US`select`(🇺🇸|United States|美国|america|unitedstates)

; ============================================================
; Ruleset
; ============================================================

; 本地地址和直连
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/LocalAreaNetwork.list

; 广告追踪直连（最高优先级）
ruleset=REJECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BanAD.list

; YouTube
ruleset=YouTube,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

; Disney+
ruleset=Disney,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/DisneyPlus.list

; HBO Max
ruleset=Hbomax,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/HBO.list

; Netflix
ruleset=Netflix,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=Netflix,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/NetflixIP.list

; Bahamut
ruleset=Bahamut,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bahamut.list

; Bilibili
ruleset=Bilibili,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list

; Spotify
ruleset=Spotify,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Spotify.list

; Steam
ruleset=Steam,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list

; Telegram
ruleset=Telegram,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list

; Google
ruleset=Google,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list

; Microsoft
ruleset=Microsoft,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Microsoft.list

; OpenAI
ruleset=OpenAI,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; PayPal
ruleset=PayPal,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list

; Apple
ruleset=Apple,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Apple.list

; Pixiv → JP
ruleset=JP,[]DOMAIN-SUFFIX,pximg.net

; 国内直连
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; PT站直连
ruleset=DIRECT,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/PrivateTracker.list

; 国内IP直连
ruleset=DIRECT,[]GEOIP,CN

; 局域网直连
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10
ruleset=DIRECT,[]IP-CIDR6,::1/128
ruleset=DIRECT,[]IP-CIDR6,fc00::/7
ruleset=DIRECT,[]IP-CIDR6,fe80::/10
ruleset=DIRECT,[]IP-CIDR6,fd00::/8

; 兜底
ruleset=Final,[]MATCH
